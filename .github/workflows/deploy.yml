name: Deploy Production (GitHub Pages & Discloud)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# NUNCA cancelar em andamento no Pages para evitar conflito de lock HTTP 400
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy-pages:
    name: Build React Admin Panel & Deploy GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      - name: Setup CNAME, .nojekyll, 404.html and SPA Routing
        run: |
          echo "pitoco.malaca.com.br" > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          for route in admin gerente gestao atendimento login ceo lojas fluxos acessos usuarios whatsapp catalogo enxoval medidas fila conversas clientes dashboard bot_config configuracoes logs; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    name: Deploy to GitHub Pages Environment
    needs: build-and-deploy-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Clear and wait for pending Pages deployments
        run: |
          echo "🔍 Verificando se há deployment anterior do Pages pendente..."
          # Consultar status da API de deployments no ambiente github-pages
          ACTIVE_DEP=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" 2>/dev/null || echo "[]")
          OLD_SHAS=$(echo "$ACTIVE_DEP" | jq -r '.[].sha' | grep -v "${{ github.sha }}" | head -n 3 || true)
          for SHA in $OLD_SHAS; do
            if [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
              echo "🧹 Limpando trava de deployment anterior para commit $SHA..."
              gh api -X POST "repos/${{ github.repository }}/pages/deployments/$SHA/cancel" 2>/dev/null || true
            fi
          done
          sleep 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Auto-recover and Retry Deploy if locked
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "⚠️ Conflito ou trava detectada no Pages. Cancelando qualquer deployment pendente..."
          ACTIVE_DEP=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" 2>/dev/null || echo "[]")
          for SHA in $(echo "$ACTIVE_DEP" | jq -r '.[].sha' | head -n 3); do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$SHA/cancel" 2>/dev/null || true
          done
          echo "⏳ Aguardando 10s para liberação definitiva do ambiente..."
          sleep 10
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages (Retry)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4

  deploy-discloud:
    name: Deploy to Discloud & Restart Bot
    needs: build-and-deploy-pages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Frontend
        run: |
          npm install --legacy-peer-deps
          npm run build
          echo "pitoco.malaca.com.br" > dist/CNAME
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy via Discloud API & Restart Bot
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          node deployDiscloud.mjs "$DISCLOUD_TOKEN"
